<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Class View – HuffazWorld</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C; --gold-light: #F0D98A;
    --emerald: #1A6B4A; --emerald-light: #E6F5EE; --emerald-dark: #0D3D29;
    --cream: #FAF7F0; --text: #1C2B22; --muted: #5A7060; --white: #ffffff;
  }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; padding-bottom: 90px; }
  nav { background: var(--emerald-dark); padding: 0.85rem 1.25rem; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 56px; }
  .nav-logo { font-family: 'Amiri', serif; font-size: 1.4rem; font-weight: 700; color: white; text-decoration: none; }
  .nav-logo span { color: var(--gold); }
  .nav-right { display: flex; align-items: center; gap: 0.75rem; }
  .nav-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: var(--emerald-dark); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; cursor: pointer; text-decoration: none; overflow: hidden; }
  .back-btn { color: rgba(255,255,255,0.8); font-size: 0.82rem; font-weight: 600; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; }
  .container { max-width: 750px; margin: 0 auto; padding: 1.25rem 1rem; padding-top: calc(56px + 1.25rem); }
  .tabs { display: flex; gap: 0; background: var(--white); border-bottom: 2px solid rgba(201,168,76,0.15); overflow-x: auto; scrollbar-width: none; margin-bottom: 1.25rem; border-radius: 12px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab-btn { padding: 0.75rem 1.1rem; font-size: 0.82rem; font-weight: 700; color: var(--muted); background: none; border: none; border-bottom: 3px solid transparent; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; white-space: nowrap; margin-bottom: -2px; transition: all 0.2s; }
  .tab-btn.active { color: var(--emerald); border-bottom-color: var(--emerald); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .section { background: var(--white); border: 1px solid rgba(201,168,76,0.18); border-radius: 16px; padding: 1.25rem; margin-bottom: 1.25rem; }
  .section-title { font-size: 0.95rem; font-weight: 700; color: var(--emerald-dark); margin-bottom: 1rem; }
  .student-card { background: var(--cream); border-radius: 14px; padding: 1rem 1.1rem; margin-bottom: 0.75rem; border: 1.5px solid transparent; cursor: pointer; transition: all 0.2s; }
  .student-card:hover, .student-card.open { border-color: var(--emerald); background: var(--emerald-light); }
  .student-card-header { display: flex; align-items: center; gap: 0.85rem; }
  .student-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--emerald); color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; flex-shrink: 0; }
  .student-name { font-size: 0.92rem; font-weight: 700; color: var(--text); }
  .student-meta { font-size: 0.72rem; color: var(--muted); margin-top: 0.15rem; }
  .progress-mini { height: 5px; background: rgba(26,107,74,0.15); border-radius: 99px; margin-top: 0.5rem; overflow: hidden; }
  .progress-mini-fill { height: 100%; background: linear-gradient(90deg, var(--emerald), var(--gold)); border-radius: 99px; }
  .student-detail { display: none; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid rgba(201,168,76,0.15); }
  .student-detail.open { display: block; }
  .task-row { background: white; border-radius: 10px; padding: 0.85rem; margin-bottom: 0.6rem; }
  .task-row-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 0.75rem; margin-bottom: 0.35rem; }
  .task-row-title { font-size: 0.85rem; font-weight: 700; color: var(--text); }
  .task-badge { font-size: 0.68rem; font-weight: 700; padding: 0.22rem 0.55rem; border-radius: 6px; white-space: nowrap; }
  .badge-pending { background: #FFF3CD; color: #856404; }
  .badge-submitted { background: var(--emerald-light); color: var(--emerald-dark); }
  .badge-graded { background: rgba(201,168,76,0.15); color: #7a5c00; }
  .submission-note { font-size: 0.78rem; color: var(--muted); font-style: italic; margin-bottom: 0.6rem; line-height: 1.5; }
  .feedback-form { display: grid; gap: 0.5rem; margin-top: 0.5rem; }
  .feedback-input { border: 1.5px solid rgba(201,168,76,0.25); border-radius: 8px; padding: 0.55rem 0.75rem; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.82rem; color: var(--text); background: var(--cream); outline: none; resize: none; width: 100%; min-height: 65px; }
  .feedback-input:focus { border-color: var(--emerald); background: white; }
  .grade-input { border: 1.5px solid rgba(201,168,76,0.25); border-radius: 8px; padding: 0.5rem 0.75rem; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.85rem; color: var(--text); background: var(--cream); outline: none; width: 100%; }
  .grade-input:focus { border-color: var(--emerald); background: white; }
  .feedback-row { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; align-items: end; }
  .send-feedback-btn { background: var(--emerald); color: white; border: none; border-radius: 8px; padding: 0.5rem 1rem; font-size: 0.8rem; font-weight: 700; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; white-space: nowrap; }
  .send-feedback-btn:hover { background: var(--emerald-dark); }
  .send-feedback-btn:disabled { background: #aab8af; cursor: not-allowed; }
  .existing-feedback { background: rgba(26,107,74,0.06); border-left: 3px solid var(--emerald); border-radius: 0 8px 8px 0; padding: 0.6rem 0.8rem; margin-bottom: 0.5rem; }
  .existing-feedback-label { font-size: 0.68rem; font-weight: 700; color: var(--emerald); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.2rem; }
  .existing-feedback-text { font-size: 0.8rem; color: var(--text); line-height: 1.5; }
  .grade-display { display: inline-block; background: var(--gold); color: var(--emerald-dark); font-family: 'Amiri', serif; font-size: 1rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 6px; margin-left: 0.5rem; }
  .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--muted); font-size: 0.85rem; }
  .empty-state .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--emerald-dark); color: white; padding: 0.65rem 1.25rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 9999; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .overview-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.75rem; margin-bottom: 1.25rem; }
  .ov-card { background: var(--white); border: 1px solid rgba(201,168,76,0.18); border-radius: 14px; padding: 1rem; text-align: center; }
  .ov-val { font-family: 'Amiri', serif; font-size: 1.8rem; font-weight: 700; color: var(--emerald-dark); }
  .ov-lbl { font-size: 0.72rem; color: var(--muted); margin-top: 0.2rem; }
  .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 1px solid rgba(201,168,76,0.18); padding: 0.5rem 0; z-index: 200; }
  .mobile-nav-inner { display: flex; justify-content: space-around; align-items: center; }
  .mobile-nav-item { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; text-decoration: none; color: var(--muted); font-size: 0.6rem; font-weight: 600; padding: 0.3rem 0.5rem; }
  .mobile-nav-item span:first-child { font-size: 1.2rem; }
  .mobile-nav-item.active, .mobile-nav-item:hover { color: var(--emerald); }
  @media (max-width: 768px) { .mobile-nav { display: block; } body { padding-bottom: 80px; } .overview-grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<nav>
  <div class="nav-right">
    <a href="classroom.html" class="back-btn">← Classroom</a>
  </div>
  <a href="dashboard.html" class="nav-logo">Huffaz<span>World</span></a>
  <a href="profile.html" class="nav-avatar" id="nav-avatar">HW</a>
</nav>

<div class="container">
  <div id="loading" class="empty-state"><div class="icon">⏳</div><p>Loading class…</p></div>
  <div id="main-content" style="display:none;">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('students', this)">👨‍🎓 Students</button>
      <button class="tab-btn" onclick="switchTab('tasks', this)">📝 Tasks & Submissions</button>
      <button class="tab-btn" onclick="switchTab('overview', this)">📊 Overview</button>
    </div>

    <!-- STUDENTS TAB -->
    <div class="tab-content active" id="tab-students">
      <div class="section">
        <div class="section-title">Enrolled Students</div>
        <div id="students-list"><div class="empty-state"><div class="icon">👥</div><p>No students enrolled yet.</p></div></div>
      </div>
    </div>

    <!-- TASKS TAB -->
    <div class="tab-content" id="tab-tasks">
      <div class="section">
        <div class="section-title">Tasks & Student Submissions</div>
        <div id="tasks-list"><div class="empty-state"><p>No tasks assigned yet.</p></div></div>
      </div>
    </div>

    <!-- OVERVIEW TAB -->
    <div class="tab-content" id="tab-overview">
      <div class="overview-grid">
        <div class="ov-card"><div class="ov-val" id="ov-students">0</div><div class="ov-lbl">Total Students</div></div>
        <div class="ov-card"><div class="ov-val" id="ov-tasks">0</div><div class="ov-lbl">Total Tasks</div></div>
        <div class="ov-card"><div class="ov-val" id="ov-submitted">0</div><div class="ov-lbl">Submissions</div></div>
        <div class="ov-card"><div class="ov-val" id="ov-graded">0</div><div class="ov-lbl">Graded</div></div>
      </div>
      <div class="section">
        <div class="section-title">Student Progress Summary</div>
        <div id="overview-list"></div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<nav class="mobile-nav">
  <div class="mobile-nav-inner">
    <a href="dashboard.html" class="mobile-nav-item"><span>🏠</span><span>Home</span></a>
    <a href="search.html" class="mobile-nav-item"><span>🔍</span><span>Search</span></a>
    <a href="tracker.html" class="mobile-nav-item"><span>📊</span><span>Tracker</span></a>
    <a href="classroom.html" class="mobile-nav-item active"><span>🏫</span><span>Class</span></a>
    <a href="profile.html" class="mobile-nav-item"><span>👤</span><span>Profile</span></a>
  </div>
</nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, addDoc, collection, query, where, getDocs, updateDoc, orderBy } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxKqk5lpSz7s4cRSQXLMCfQmfU8k-iHK8",
    authDomain: "huffazworld.firebaseapp.com",
    projectId: "huffazworld",
    storageBucket: "huffazworld.firebasestorage.app",
    messagingSenderId: "1071311461394",
    appId: "1:1071311461394:web:2218e814e9a3a40f5b9c74"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let currentUserData = null;
  let classId = null;
  let classData = null;
  let students = [];
  let tasks = [];

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  window.switchTab = function(tab, btn) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + tab).classList.add('active');
    if (tab === 'overview') renderOverview();
  };

  window.toggleStudent = function(uid) {
    const detail = document.getElementById('detail-' + uid);
    const card = document.getElementById('scard-' + uid);
    const isOpen = detail.classList.contains('open');
    document.querySelectorAll('.student-detail').forEach(d => d.classList.remove('open'));
    document.querySelectorAll('.student-card').forEach(c => c.classList.remove('open'));
    if (!isOpen) { detail.classList.add('open'); card.classList.add('open'); }
  };

  window.sendFeedback = async function(taskId, studentUid, btnEl) {
    const feedbackEl = document.getElementById(`fb-${taskId}-${studentUid}`);
    const gradeEl = document.getElementById(`gr-${taskId}-${studentUid}`);
    const feedback = feedbackEl?.value.trim();
    const grade = gradeEl?.value.trim();
    if (!feedback) { showToast('Please write feedback first.'); return; }
    btnEl.disabled = true; btnEl.textContent = 'Sending…';
    try {
      const taskRef = doc(db, 'classes', classId, 'tasks', taskId);
      await updateDoc(taskRef, {
        [`submissions.${studentUid}.feedback`]: feedback,
        [`submissions.${studentUid}.grade`]: grade || null,
        [`submissions.${studentUid}.status`]: 'graded',
        [`submissions.${studentUid}.gradedAt`]: new Date().toISOString()
      });
      // Notify student
      const student = students.find(s => s.uid === studentUid);
      await addDoc(collection(db, 'notifications'), {
        toUid: studentUid,
        type: 'task_graded',
        message: `🏅 <strong>${currentUserData.fullname}</strong> graded your task${grade ? ' — Grade: <strong>' + grade + '</strong>' : ''}. Tap to see feedback.`,
        fromUid: currentUser.uid, classId, taskId, read: false,
        createdAt: new Date().toISOString()
      });
      showToast('✅ Feedback sent!');
      await loadTasks();
    } catch(e) { console.error(e); showToast('Could not send feedback.'); btnEl.disabled = false; btnEl.textContent = 'Send'; }
  };

  async function loadStudents() {
    students = [];
    if (!classData.students || classData.students.length === 0) { renderStudents(); return; }
    for (const uid of classData.students) {
      try {
        const d = await getDoc(doc(db, 'users', uid));
        if (d.exists()) students.push({ uid, ...d.data() });
      } catch(e) { console.error('loadStudents error for uid', uid, e); }
    }
    renderStudents();
  }

  async function loadTasks() {
    try {
      const snap = await getDocs(collection(db, 'classes', classId, 'tasks'));
      tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
      renderTasksTab();
    } catch(e) { console.error('loadTasks error:', e); }
  }

  function renderStudents() {
    const el = document.getElementById('students-list');
    if (students.length === 0) { el.innerHTML = '<div class="empty-state"><div class="icon">👥</div><p>No students enrolled yet.</p></div>'; return; }
    el.innerHTML = students.map(s => {
      const initials = (s.fullname || '?').split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
      const progress = s.hifzPercent || 0;
      const myTasks = tasks.filter(t => t.assignee === 'all' || t.assignee === s.uid);
      const submitted = myTasks.filter(t => {
        const sub = t.submissions?.[s.uid];
        return sub?.status === 'submitted' || sub?.status === 'graded';
      }).length;
      const graded = myTasks.filter(t => t.submissions?.[s.uid]?.status === 'graded').length;
      const taskRows = myTasks.length === 0 ? '<p style="font-size:0.8rem;color:var(--muted);">No tasks assigned yet.</p>' :
        myTasks.map(t => {
          const sub = t.submissions?.[s.uid];
          const status = sub?.status || 'pending';
          const badgeMap = { pending: '<span class="task-badge badge-pending">⏳ Pending</span>', submitted: '<span class="task-badge badge-submitted">✅ Submitted</span>', graded: '<span class="task-badge badge-graded">🏅 Graded</span>' };
          const existingFeedback = sub?.feedback ? `
            <div class="existing-feedback">
              <div class="existing-feedback-label">Your Feedback${sub.grade ? ' · <span class="grade-display">' + sub.grade + '</span>' : ''}</div>
              <div class="existing-feedback-text">${sub.feedback}</div>
            </div>` : '';
          const noteHtml = sub?.note ? `<div class="submission-note">Student note: "${sub.note}"</div>` : '';
          const feedbackForm = status === 'submitted' ? `
            ${noteHtml}
            <div class="feedback-form">
              <textarea class="feedback-input" id="fb-${t.id}-${s.uid}" placeholder="Write feedback for this student…"></textarea>
              <div class="feedback-row">
                <input type="text" class="grade-input" id="gr-${t.id}-${s.uid}" placeholder="Grade (e.g. Excellent, 90/100, A+)"/>
                <button class="send-feedback-btn" onclick="sendFeedback('${t.id}','${s.uid}',this)">Send</button>
              </div>
            </div>` : '';
          return `
            <div class="task-row">
              <div class="task-row-header"><div class="task-row-title">📝 ${t.title}</div>${badgeMap[status] || ''}</div>
              ${existingFeedback}
              ${feedbackForm}
            </div>`;
        }).join('');
      return `
        <div class="student-card" id="scard-${s.uid}" onclick="toggleStudent('${s.uid}')">
          <div class="student-card-header">
            <div class="student-avatar">${initials}</div>
            <div style="flex:1;">
              <div class="student-name">${s.fullname || 'Student'}</div>
              <div class="student-meta">${s.country || ''} · ${submitted}/${myTasks.length} submitted · ${graded} graded</div>
              <div class="progress-mini"><div class="progress-mini-fill" style="width:${progress}%"></div></div>
            </div>
          </div>
          <div class="student-detail" id="detail-${s.uid}">
            <div style="font-size:0.8rem;font-weight:700;color:var(--emerald-dark);margin-bottom:0.6rem;">Tasks</div>
            ${taskRows}
          </div>
        </div>`;
    }).join('');
  }

  function renderTasksTab() {
    const el = document.getElementById('tasks-list');
    if (tasks.length === 0) { el.innerHTML = '<div class="empty-state"><p>No tasks yet. Assign one from the Classroom page.</p></div>'; return; }
    el.innerHTML = tasks.map(t => {
      const assigneeName = t.assignee === 'all' ? 'All Students' : (students.find(s => s.uid === t.assignee)?.fullname || 'Student');
      const subs = Object.values(t.submissions || {});
      const submitted = subs.filter(s => s.status === 'submitted' || s.status === 'graded').length;
      const graded = subs.filter(s => s.status === 'graded').length;
      const total = t.assignee === 'all' ? students.length : 1;
      return `
        <div class="task-row" style="margin-bottom:0.75rem;">
          <div class="task-row-header">
            <div class="task-row-title">📝 ${t.title}</div>
            <span style="font-size:0.72rem;color:var(--muted);white-space:nowrap;">${submitted}/${total} submitted</span>
          </div>
          <div style="font-size:0.78rem;color:var(--muted);">→ ${assigneeName}${t.due ? ' · Due: ' + t.due : ''} · ${graded} graded</div>
          ${t.description ? `<div style="font-size:0.78rem;color:var(--muted);margin-top:0.3rem;font-style:italic;">"${t.description}"</div>` : ''}
        </div>`;
    }).join('');
    renderStudents(); // re-render students tab with fresh task data
  }

  function renderOverview() {
    const totalSubs = tasks.reduce((sum, t) => sum + Object.values(t.submissions || {}).filter(s => s.status === 'submitted' || s.status === 'graded').length, 0);
    const totalGraded = tasks.reduce((sum, t) => sum + Object.values(t.submissions || {}).filter(s => s.status === 'graded').length, 0);
    document.getElementById('ov-students').textContent = students.length;
    document.getElementById('ov-tasks').textContent = tasks.length;
    document.getElementById('ov-submitted').textContent = totalSubs;
    document.getElementById('ov-graded').textContent = totalGraded;
    const el = document.getElementById('overview-list');
    if (students.length === 0) { el.innerHTML = '<div class="empty-state"><p>No students yet.</p></div>'; return; }
    el.innerHTML = students.map(s => {
      const myTasks = tasks.filter(t => t.assignee === 'all' || t.assignee === s.uid);
      const submitted = myTasks.filter(t => { const sub = t.submissions?.[s.uid]; return sub?.status === 'submitted' || sub?.status === 'graded'; }).length;
      const graded = myTasks.filter(t => t.submissions?.[s.uid]?.status === 'graded').length;
      const pct = myTasks.length > 0 ? Math.round(submitted / myTasks.length * 100) : 0;
      const initials = (s.fullname || '?').split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
      return `
        <div style="display:flex;align-items:center;gap:0.85rem;padding:0.75rem 0;border-bottom:1px solid rgba(201,168,76,0.1);">
          <div class="student-avatar" style="width:36px;height:36px;font-size:0.78rem;">${initials}</div>
          <div style="flex:1;">
            <div style="font-size:0.88rem;font-weight:700;">${s.fullname || 'Student'}</div>
            <div style="font-size:0.72rem;color:var(--muted);">${submitted}/${myTasks.length} tasks · ${graded} graded · ${s.hifzPercent || 0}% Hifz</div>
            <div class="progress-mini"><div class="progress-mini-fill" style="width:${pct}%"></div></div>
          </div>
          <div style="font-family:'Amiri',serif;font-size:1.2rem;font-weight:700;color:var(--emerald-dark);">${pct}%</div>
        </div>`;
    }).join('');
  }

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = 'login.html'; return; }
    currentUser = user;
    try {
      const d = await getDoc(doc(db, 'users', user.uid));
      currentUserData = d.exists() ? d.data() : {};
      const name = currentUserData.fullname || 'Teacher';
      const initials = name.split(' ').map(n => n[0]).join('').toUpperCase().slice(0,2);
      const av = document.getElementById('nav-avatar');
      if (currentUserData.photoURL) av.innerHTML = `<img src="${currentUserData.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"/>`;
      else av.textContent = initials;

      // Get class from URL or find by teacher
      const params = new URLSearchParams(window.location.search);
      const urlClassId = params.get('id');
      if (urlClassId) {
        classId = urlClassId;
      } else {
        const q = query(collection(db, 'classes'), where('teacherUid', '==', user.uid));
        const snap = await getDocs(q);
        if (snap.empty) { window.location.href = 'classroom.html'; return; }
        classId = snap.docs[0].id;
      }
      const classDoc = await getDoc(doc(db, 'classes', classId));
      if (!classDoc.exists()) { window.location.href = 'classroom.html'; return; }
      classData = classDoc.data();
      document.getElementById('loading').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      await loadStudents();  // await so students[] is ready before renderTasks uses it
      await loadTasks();
    } catch(e) { console.error(e); showToast('Error loading class view.'); }
  });
</script>
</body>
</html>
