<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Join a Class – HuffazWorld</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C; --gold-light: #F0D98A;
    --emerald: #1A6B4A; --emerald-light: #E6F5EE; --emerald-dark: #0D3D29;
    --cream: #FAF7F0; --text: #1C2B22; --muted: #5A7060; --white: #ffffff;
  }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; padding-bottom: 90px; }
  nav { background: var(--emerald-dark); padding: 0.85rem 1.25rem; display: flex; align-items: center; justify-content: space-between; position: fixed; top: 0; left: 0; right: 0; z-index: 100; height: 56px; }
  .nav-logo { font-family: 'Amiri', serif; font-size: 1.4rem; font-weight: 700; color: white; text-decoration: none; }
  .nav-logo span { color: var(--gold); }
  .nav-avatar { width: 34px; height: 34px; border-radius: 50%; background: var(--gold); color: var(--emerald-dark); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem; text-decoration: none; overflow: hidden; }
  .container { max-width: 500px; margin: 0 auto; padding: 1.25rem 1rem; padding-top: calc(56px + 1.25rem); }
  .banner { background: linear-gradient(135deg, var(--emerald-dark), var(--emerald)); border-radius: 20px; padding: 1.5rem; margin-bottom: 1.5rem; text-align: center; }
  .banner h1 { font-family: 'Amiri', serif; font-size: 1.5rem; color: white; margin-bottom: 0.3rem; }
  .banner p { font-size: 0.82rem; color: rgba(255,255,255,0.65); }
  .section { background: var(--white); border: 1px solid rgba(201,168,76,0.18); border-radius: 16px; padding: 1.5rem; margin-bottom: 1.25rem; }
  .section-title { font-size: 0.95rem; font-weight: 700; color: var(--emerald-dark); margin-bottom: 0.5rem; text-align: center; }
  .section-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.25rem; text-align: center; }
  .code-input-wrap { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .code-input { flex: 1; border: 2px solid rgba(201,168,76,0.3); border-radius: 12px; padding: 0.85rem 1rem; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 1.1rem; font-weight: 700; color: var(--text); background: var(--cream); outline: none; text-transform: uppercase; letter-spacing: 0.1em; text-align: center; }
  .code-input:focus { border-color: var(--emerald); background: white; }
  .join-btn { width: 100%; background: var(--emerald); color: white; border: none; border-radius: 12px; padding: 0.85rem; font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.2s; }
  .join-btn:hover { background: var(--emerald-dark); }
  .join-btn:disabled { background: #aab8af; cursor: not-allowed; }
  /* Preview card */
  .preview-card { background: var(--emerald-light); border: 1.5px solid rgba(26,107,74,0.2); border-radius: 14px; padding: 1.1rem; margin-bottom: 1rem; display: none; }
  .preview-card.show { display: block; }
  .preview-label { font-size: 0.72rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 0.5rem; }
  .preview-name { font-size: 1rem; font-weight: 700; color: var(--emerald-dark); margin-bottom: 0.2rem; }
  .preview-teacher { font-size: 0.82rem; color: var(--muted); }
  .preview-badge { display: inline-block; background: var(--emerald); color: white; font-size: 0.7rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 99px; margin-top: 0.4rem; }
  /* Already in class */
  .my-class-card { background: linear-gradient(135deg, var(--emerald-dark), var(--emerald)); border-radius: 16px; padding: 1.25rem; margin-bottom: 1.25rem; color: white; }
  .my-class-name { font-family: 'Amiri', serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 0.3rem; }
  .my-class-teacher { font-size: 0.82rem; color: rgba(255,255,255,0.7); margin-bottom: 1rem; }
  .view-class-btn { display: block; background: rgba(255,255,255,0.2); color: white; text-align: center; border-radius: 10px; padding: 0.6rem; font-weight: 700; font-size: 0.88rem; text-decoration: none; margin-bottom: 0.5rem; }
  .leave-btn { display: block; background: rgba(229,57,53,0.2); color: #ffcdd2; text-align: center; border-radius: 10px; padding: 0.5rem; font-weight: 700; font-size: 0.8rem; cursor: pointer; border: none; width: 100%; font-family: 'Plus Jakarta Sans', sans-serif; }
  #toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--emerald-dark); color: white; padding: 0.65rem 1.25rem; border-radius: 10px; font-size: 0.85rem; font-weight: 600; opacity: 0; transition: all 0.3s; z-index: 9999; pointer-events: none; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #loading { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--cream); position: fixed; inset: 0; z-index: 999; }
  .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--white); border-top: 1px solid rgba(201,168,76,0.18); padding: 0.5rem 0; z-index: 200; }
  .mobile-nav-inner { display: flex; justify-content: space-around; }
  .mobile-nav-item { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; text-decoration: none; color: var(--muted); font-size: 0.6rem; font-weight: 600; padding: 0.3rem 0.5rem; }
  .mobile-nav-item span:first-child { font-size: 1.2rem; }
  .mobile-nav-item.active { color: var(--emerald); }
  @media (max-width: 768px) { .mobile-nav { display: block; } }
</style>
</head>
<body>
<div id="loading"><div style="font-family:'Amiri',serif;font-size:1.5rem;color:#1A6B4A;">Loading... 🤲</div></div>
<nav>
  <a href="dashboard.html" class="nav-logo">Huffaz<span>World</span></a>
  <a href="profile.html" class="nav-avatar" id="nav-avatar">?</a>
</nav>
<div id="toast"></div>
<div class="container" id="app" style="display:none;">
  <div class="banner">
    <h1>📖 Join a Class</h1>
    <p>Enter the code your teacher shared with you</p>
  </div>

  <!-- ALREADY IN A CLASS -->
  <div id="already-in-class" style="display:none;">
    <div class="my-class-card">
      <div style="font-size:0.72rem;color:rgba(255,255,255,0.6);margin-bottom:0.4rem;">YOUR CURRENT CLASS</div>
      <div class="my-class-name" id="my-class-name">Loading...</div>
      <div class="my-class-teacher" id="my-class-teacher"></div>
      <a href="my-class.html" class="view-class-btn">📖 View My Class & Tasks</a>
      <button class="leave-btn" onclick="leaveClass()">Leave this class</button>
    </div>
  </div>

  <!-- JOIN FORM -->
  <div id="join-form-section">
    <div class="section">
      <div class="section-title">Enter Class Code</div>
      <div class="section-sub">Your teacher will share a code like <strong>HW-XXXX</strong></div>

      <!-- PREVIEW CARD -->
      <div class="preview-card" id="preview-card">
        <div class="preview-label">✅ Class Found</div>
        <div class="preview-name" id="preview-name"></div>
        <div class="preview-teacher" id="preview-teacher"></div>
        <span class="preview-badge" id="preview-level"></span>
      </div>

      <div class="code-input-wrap">
        <input type="text" class="code-input" id="code-input" maxlength="7" placeholder="HW-XXXX" oninput="handleCodeInput(this)"/>
      </div>
      <button class="join-btn" id="join-btn" onclick="joinClass()">Join Class 🤲</button>
    </div>
  </div>
</div>

<nav class="mobile-nav">
    <div class="mobile-nav-inner">
      <a href="dashboard.html" class="mobile-nav-item"><span>🏠</span><span>Home</span></a>
      <a href="search.html" class="mobile-nav-item"><span>🔍</span><span>Search</span></a>
      <a href="messages.html" class="mobile-nav-item"><span>💬</span><span>Chat</span></a>
      <a href="notifications.html" class="mobile-nav-item"><span>🔔</span><span>Alerts</span></a>
      <a href="profile.html" class="mobile-nav-item"><span>👤</span><span>Profile</span></a>
    </div>
  </nav>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import { getFirestore, collection, doc, getDoc, setDoc, updateDoc, getDocs, query, where, arrayUnion } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxKqk5lpSz7s4cRSQXLMCfQmfU8k-iHK8",
    authDomain: "huffazworld.firebaseapp.com",
    projectId: "huffazworld",
    storageBucket: "huffazworld.firebasestorage.app",
    messagingSenderId: "1071311461394",
    appId: "1:1071311461394:web:2218e814e9a3a40f5b9c74"
  };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;
  let currentUserData = null;
  let foundClass = null;
  let myCurrentClassId = null;

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  let searchTimeout = null;
  window.handleCodeInput = function(input) {
    input.value = input.value.toUpperCase();
    const code = input.value.trim();
    clearTimeout(searchTimeout);
    document.getElementById('preview-card').classList.remove('show');
    foundClass = null;
    if (code.length >= 7) {
      searchTimeout = setTimeout(() => searchClass(code), 400);
    }
  }

  async function searchClass(code) {
    try {
      const snap = await getDocs(query(collection(db, 'classes'), where('code','==',code)));
      if (!snap.empty) {
        const d = snap.docs[0];
        foundClass = { id: d.id, ...d.data() };
        document.getElementById('preview-name').textContent = foundClass.name;
        document.getElementById('preview-teacher').textContent = '👨‍🏫 ' + foundClass.teacherName;
        document.getElementById('preview-level').textContent = foundClass.level || 'Class';
        document.getElementById('preview-card').classList.add('show');
      } else {
        foundClass = null;
      }
    } catch(e) {}
  }

  window.joinClass = async function() {
    const code = document.getElementById('code-input').value.trim().toUpperCase();
    if (!code) { showToast('⚠️ Please enter a class code.'); return; }
    const btn = document.getElementById('join-btn');
    btn.disabled = true; btn.textContent = 'Joining...';
    try {
      // Search for class
      if (!foundClass) await searchClass(code);
      if (!foundClass) { showToast('❌ Class not found. Check the code and try again.'); btn.disabled = false; btn.textContent = 'Join Class 🤲'; return; }
      if (foundClass.teacherUid === currentUser.uid) { showToast('⚠️ You cannot join your own class!'); btn.disabled = false; btn.textContent = 'Join Class 🤲'; return; }
      if ((foundClass.students||[]).includes(currentUser.uid)) { showToast('You are already in this class!'); btn.disabled = false; btn.textContent = 'Join Class 🤲'; return; }
      // Add student to class
      await updateDoc(doc(db, 'classes', foundClass.id), { students: arrayUnion(currentUser.uid) });
      // Save class reference to student's profile
      await updateDoc(doc(db, 'users', currentUser.uid), { classId: foundClass.id });
      myCurrentClassId = foundClass.id;
      // Notify teacher
      await setDoc(doc(db, 'notifications', 'joined_' + currentUser.uid + '_' + foundClass.teacherUid), {
        toUid: foundClass.teacherUid,
        type: 'student_joined',
        message: '<strong>' + (currentUserData.fullname||'A student') + '</strong> joined your class <strong>' + foundClass.name + '</strong>! 🎉',
        fromUid: currentUser.uid,
        fromName: currentUserData.fullname || 'Student',
        read: false,
        createdAt: new Date().toISOString()
      });
      showToast('🎉 Joined ' + foundClass.name + '! Bismillah! 🤲');
      setTimeout(() => window.location.href = 'my-class.html', 1500);
    } catch(e) { showToast('Could not join class. Try again.'); }
    btn.disabled = false; btn.textContent = 'Join Class 🤲';
  }

  window.leaveClass = async function() {
    if (!myCurrentClassId || !confirm('Leave this class?')) return;
    try {
      const classSnap = await getDoc(doc(db, 'classes', myCurrentClassId));
      if (classSnap.exists()) {
        const students = (classSnap.data().students||[]).filter(s => s !== currentUser.uid);
        await updateDoc(doc(db, 'classes', myCurrentClassId), { students });
      }
      await updateDoc(doc(db, 'users', currentUser.uid), { classId: null });
      showToast('You have left the class.');
      document.getElementById('already-in-class').style.display = 'none';
      document.getElementById('join-form-section').style.display = 'block';
      myCurrentClassId = null;
    } catch(e) { showToast('Could not leave class.'); }
  }

  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      try {
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        currentUserData = userDoc.exists() ? userDoc.data() : {};
        const name = currentUserData.fullname || 'Student';
        const navAvatar = document.getElementById('nav-avatar');
        if (currentUserData.photoURL) { navAvatar.innerHTML = `<img src="${currentUserData.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;"/>`; }
        else { navAvatar.textContent = name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2); }
        // Check if already in a class
        if (currentUserData.classId) {
          myCurrentClassId = currentUserData.classId;
          const classSnap = await getDoc(doc(db, 'classes', currentUserData.classId));
          if (classSnap.exists()) {
            const c = classSnap.data();
            document.getElementById('my-class-name').textContent = c.name;
            document.getElementById('my-class-teacher').textContent = '👨‍🏫 ' + c.teacherName;
            document.getElementById('already-in-class').style.display = 'block';
            document.getElementById('join-form-section').style.display = 'none';
          }
        }
      } catch(e) {}
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    } else { window.location.href = 'login.html'; }
  });
</script>
</body>
</html>
