<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Groups – HuffazWorld</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C; --gold-light: #F0D98A;
    --emerald: #1A6B4A; --emerald-light: #E6F5EE; --emerald-dark: #0D3D29;
    --cream: #FAF7F0; --text: #1C2B22; --muted: #5A7060; --white: #ffffff;
  }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--cream); color: var(--text); min-height: 100vh; }
  nav { background: var(--emerald-dark); padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .nav-logo { font-family: 'Amiri', serif; font-size: 1.5rem; font-weight: 700; color: white; text-decoration: none; }
  .nav-logo span { color: var(--gold); }
  .nav-right { display: flex; align-items: center; gap: 1rem; }
  .nav-link { color: rgba(255,255,255,0.7); text-decoration: none; font-size: 0.88rem; font-weight: 500; }
  .nav-link:hover { color: white; }
  .nav-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gold); color: var(--emerald-dark); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.85rem; text-decoration: none; }
  .logout-btn { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); padding: 0.4rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; }

  .container { max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

  /* HERO */
  .groups-hero { background: linear-gradient(135deg, var(--emerald-dark), var(--emerald)); border-radius: 24px; padding: 2.5rem 2rem; margin-bottom: 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1.5rem; }
  .groups-hero h1 { font-family: 'Amiri', serif; font-size: 2.2rem; color: white; margin-bottom: 0.4rem; }
  .groups-hero p { color: rgba(255,255,255,0.65); font-size: 0.95rem; max-width: 400px; line-height: 1.6; }
  .create-btn { background: var(--gold); color: var(--emerald-dark); border: none; border-radius: 14px; padding: 0.85rem 1.5rem; font-size: 0.95rem; font-weight: 700; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; text-decoration: none; display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s; white-space: nowrap; box-shadow: 0 4px 16px rgba(201,168,76,0.3); }
  .create-btn:hover { background: var(--gold-light); transform: translateY(-2px); }

  /* SEARCH & FILTERS */
  .search-row { display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
  .search-box { position: relative; flex: 1; min-width: 200px; }
  .search-input { width: 100%; padding: 0.85rem 1rem 0.85rem 2.8rem; border: 1.5px solid rgba(201,168,76,0.25); border-radius: 14px; font-size: 0.92rem; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--white); outline: none; }
  .search-input:focus { border-color: var(--emerald); }
  .search-icon { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); }

  .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
  .filter-btn { padding: 0.45rem 1rem; border-radius: 50px; border: 1.5px solid rgba(201,168,76,0.25); background: var(--white); font-size: 0.82rem; font-weight: 600; color: var(--muted); cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s; }
  .filter-btn.active { background: var(--emerald); color: white; border-color: var(--emerald); }

  /* SECTIONS */
  .section-title { font-family: 'Amiri', serif; font-size: 1.4rem; color: var(--emerald-dark); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; }

  /* GROUPS GRID */
  .groups-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; margin-bottom: 2.5rem; }

  .group-card { background: var(--white); border: 1px solid rgba(201,168,76,0.18); border-radius: 20px; overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; text-decoration: none; display: block; }
  .group-card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(15,26,20,0.1); }
  .group-banner { height: 80px; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; position: relative; }
  .group-privacy { position: absolute; top: 0.5rem; right: 0.75rem; font-size: 0.68rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 50px; }
  .group-privacy.public { background: rgba(255,255,255,0.25); color: white; }
  .group-privacy.private { background: rgba(0,0,0,0.2); color: white; }
  .group-body { padding: 1.1rem; }
  .group-type-badge { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold-dark, #8A6A1F); margin-bottom: 0.4rem; }
  .group-name { font-size: 1rem; font-weight: 700; color: var(--emerald-dark); margin-bottom: 0.4rem; line-height: 1.3; }
  .group-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.5; margin-bottom: 0.85rem; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .group-footer { display: flex; align-items: center; justify-content: space-between; }
  .group-members { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 0.3rem; }
  .join-btn { background: var(--emerald); color: white; border: none; border-radius: 8px; padding: 0.4rem 0.9rem; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: 'Plus Jakarta Sans', sans-serif; transition: background 0.2s; }
  .join-btn:hover { background: var(--emerald-dark); }
  .join-btn.joined { background: var(--emerald-light); color: var(--emerald-dark); }
  .join-btn.pending { background: #fff8e1; color: #856404; }

  /* MY GROUPS */
  .my-groups-list { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 2.5rem; }
  .my-group-item { background: var(--white); border: 1px solid rgba(201,168,76,0.15); border-radius: 14px; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; text-decoration: none; transition: all 0.2s; }
  .my-group-item:hover { transform: translateX(4px); box-shadow: 0 4px 16px rgba(15,26,20,0.06); }
  .my-group-icon { width: 46px; height: 46px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; }
  .my-group-info { flex: 1; }
  .my-group-name { font-size: 0.92rem; font-weight: 700; color: var(--emerald-dark); }
  .my-group-meta { font-size: 0.75rem; color: var(--muted); margin-top: 0.15rem; }
  .my-group-role { font-size: 0.68rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 4px; }
  .my-group-role.admin { background: var(--gold); color: var(--emerald-dark); }
  .my-group-role.member { background: var(--emerald-light); color: var(--emerald); }

  .empty-state { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 0.75rem; }

  /* MOBILE NAV */
  .mobile-nav { display: none; position: fixed; bottom: 0; left: 0; right: 0; background: var(--emerald-dark); border-top: 1px solid rgba(201,168,76,0.2); padding: 0.5rem 0 0.75rem; z-index: 200; }
  .mobile-nav-inner { display: flex; justify-content: space-around; align-items: center; }
  .mobile-nav-item { display: flex; flex-direction: column; align-items: center; gap: 0.2rem; text-decoration: none; flex: 1; padding: 0.3rem 0; border: none; background: none; font-family: 'Plus Jakarta Sans', sans-serif; }
  .mobile-nav-item .m-icon { font-size: 1.3rem; }
  .mobile-nav-item .m-label { font-size: 0.62rem; font-weight: 600; color: rgba(255,255,255,0.55); }
  .mobile-nav-item.active .m-label { color: var(--gold); }
  .mobile-nav-post { background: var(--gold); border-radius: 50%; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; font-size: 1.4rem; margin-top: -1.2rem; border: 3px solid var(--emerald-dark); text-decoration: none; flex-shrink: 0; }
  @media (max-width: 768px) {
    .mobile-nav { display: block; }
    body { padding-bottom: 70px; }
    nav { padding: 0.85rem 1.25rem; }
    .groups-grid { grid-template-columns: 1fr; }
    .container { padding: 1rem; }
    .groups-hero { padding: 1.5rem 1.25rem; border-radius: 16px; }
    .groups-hero h1 { font-size: 1.6rem; }
    .create-btn { width: 100%; justify-content: center; }
    .filters { gap: 0.4rem; }
    .filter-btn { font-size: 0.75rem; padding: 0.35rem 0.7rem; }
  }

  #loading { position: fixed; inset: 0; background: var(--cream); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 999; }
  #loading .logo { font-family: 'Amiri', serif; font-size: 2.5rem; font-weight: 700; color: var(--emerald-dark); }
  #loading .logo span { color: var(--gold); }
  .loading-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); display: inline-block; animation: bounce 1.2s infinite; margin: 0 3px; }
  .loading-dot:nth-child(2) { animation-delay: 0.2s; }
  .loading-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%,80%,100%{transform:scale(0.6)} 40%{transform:scale(1)} }
  .toast { position: fixed; bottom: 5rem; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--emerald-dark); color: white; padding: 0.75rem 1.5rem; border-radius: 12px; font-size: 0.88rem; font-weight: 600; z-index: 9999; transition: transform 0.3s; pointer-events: none; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  @keyframes fadeUp { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }

  /* HIDE TOP NAV LINKS ON MOBILE */
  @media (max-width: 768px) {
    .nav-right .nav-link,
    .nav-right .logout-btn,
    .nav-right .nav-avatar {
      display: none !important;
    }
    .nav-right .nav-avatar { display: none !important; }
    .nav-right .msg-nav-link { display: inline-flex !important; }
    .nav-right .group-nav-link { display: inline-flex !important; }
    nav { justify-content: space-between; }
  }

</style>
</head>
<body>

<div id="loading">
  <div class="logo">Huffaz<span>World</span></div>
  <div style="margin-top:1rem;"><span class="loading-dot"></span><span class="loading-dot"></span><span class="loading-dot"></span></div>
</div>
<div class="toast" id="toast"></div>

<div id="app" style="display:none;">
  <nav>
    <a href="dashboard.html" class="nav-logo">Huffaz<span>World</span></a>
    <div class="nav-right">
      <a href="dashboard.html" class="nav-link">🏠 Feed</a>
      <a href="search.html" class="nav-link">🔍 Search</a>
      <a href="messages.html" class="nav-link msg-nav-link">💬</a>
      <a href="notifications.html" class="nav-link">🔔</a>
      <a href="profile.html" class="nav-avatar" id="nav-avatar">?</a>
      <button class="logout-btn" onclick="handleLogout()">Sign Out</button>
    </div>
  </nav>

  <div class="container">
    <!-- HERO -->
    <div class="groups-hero">
      <div>
        <h1>🕌 Groups & Circles</h1>
        <p>Join Hifz circles, school pages, and Islamic organizations. Learn and grow together with your community!</p>
      </div>
      <a href="create-group.html" class="create-btn">✚ Create Group</a>
    </div>

    <!-- SEARCH & FILTERS -->
    <div class="search-row">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="search-input" placeholder="Search groups..." oninput="handleSearch()" />
      </div>
    </div>

    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">🌍 All Groups</button>
      <button class="filter-btn" onclick="setFilter('circle',this)">📖 Hifz Circles</button>
      <button class="filter-btn" onclick="setFilter('school',this)">🎓 Schools</button>
      <button class="filter-btn" onclick="setFilter('organization',this)">🕌 Organizations</button>
      <button class="filter-btn" onclick="setFilter('public',this)">🔓 Public</button>
      <button class="filter-btn" onclick="setFilter('private',this)">🔒 Private</button>
    </div>

    <!-- MY GROUPS -->
    <div id="my-groups-section">
      <div class="section-title">👤 My Groups</div>
      <div id="my-groups-list"><div style="color:var(--muted);font-size:0.85rem;padding:1rem 0;">Loading your groups...</div></div>
    </div>

    <!-- DISCOVER -->
    <div class="section-title" style="margin-top:2rem;">🌍 Discover Groups</div>
    <div id="groups-container">
      <div style="text-align:center;padding:2rem;color:var(--muted);">Loading groups...</div>
    </div>
  </div>

  <!-- MOBILE NAV -->
  <div class="mobile-nav">
    <div class="mobile-nav-inner">
      <a href="dashboard.html" class="mobile-nav-item"><span class="m-icon">🏠</span><span class="m-label">Home</span></a>
      <a href="search.html" class="mobile-nav-item"><span class="m-icon">🔍</span><span class="m-label">Search</span></a>
      <a href="messages.html" class="mobile-nav-item"><span class="m-icon">💬</span><span class="m-label">Chat</span></a>
      <a href="notifications.html" class="mobile-nav-item"><span class="m-icon">🔔</span><span class="m-label">Alerts</span></a>
      <a href="profile.html" class="mobile-nav-item"><span class="m-icon">👤</span><span class="m-label">Profile</span></a>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import { getFirestore, collection, doc, getDoc, getDocs, updateDoc, arrayUnion, arrayRemove, query, where } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxKqk5lpSz7s4cRSQXLMCfQmfU8k-iHK8",
    authDomain: "huffazworld.firebaseapp.com",
    projectId: "huffazworld",
    storageBucket: "huffazworld.firebasestorage.app",
    messagingSenderId: "69769070061",
    appId: "1:69769070061:web:469c095c061654b4d013e4"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  let currentUser = null;
  let allGroups = [];
  let myGroupIds = [];
  let activeFilter = 'all';
  let searchQuery = '';

  // Default groups to show when DB is empty
  const defaultGroups = [
    { id:'g1', name:'Juz Amma Circle 🌟', type:'circle', privacy:'public', emoji:'📖', color:'#1A6B4A', desc:'Memorize Juz Amma together! Daily revision sessions for beginners and advanced learners.', members:['demo'], memberCount:124, country:'Nigeria', createdBy:'system' },
    { id:'g2', name:'Ma\'ahad Ulumuddin Islami', type:'school', privacy:'public', emoji:'🕌', color:'#0D3D29', desc:'Official page for Ma\'ahad Ulumuddin Islami. Students, teachers and alumni welcome!', members:['demo'], memberCount:87, country:'Nigeria', createdBy:'system' },
    { id:'g3', name:'Global Huffaz Network', type:'organization', privacy:'public', emoji:'🌍', color:'#C9A84C', desc:'Connecting certified Huffaz from around the world. Share recitations and inspire each other.', members:['demo'], memberCount:2340, country:'Global', createdBy:'system' },
    { id:'g4', name:'Surah Al-Baqarah Study Group', type:'circle', privacy:'public', emoji:'📚', color:'#457B9D', desc:'Working through Al-Baqarah together. Weekly check-ins, tips, and encouragement.', members:['demo'], memberCount:56, country:'Global', createdBy:'system' },
    { id:'g5', name:'Junior Huffaz — Ages 8-12', type:'circle', privacy:'public', emoji:'⭐', color:'#E76F51', desc:'A safe and fun space for young Qur\'an memorizers. Parents and teachers can join too!', members:['demo'], memberCount:198, country:'Global', createdBy:'system' },
    { id:'g6', name:'Tajweed Masters', type:'organization', privacy:'public', emoji:'🎙️', color:'#2A9D8F', desc:'Advanced Tajweed discussions, tips from certified teachers, and recitation reviews.', members:['demo'], memberCount:412, country:'Global', createdBy:'system' },
    { id:'g7', name:'Sisters Hifz Circle 🌸', type:'circle', privacy:'private', emoji:'🌸', color:'#E9C46A', desc:'A private, supportive space for sisters on their Hifz journey. Apply to join.', members:['demo'], memberCount:76, country:'Global', createdBy:'system' },
    { id:'g8', name:'Daily Dua Circle', type:'circle', privacy:'public', emoji:'🤲', color:'#264653', desc:'Share duas, reminders and supplications daily. Start and end your day with remembrance of Allah.', members:['demo'], memberCount:891, country:'Global', createdBy:'system' },
  ];

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2800);
  }

  function getBannerStyle(g) {
    return `background:linear-gradient(135deg, ${g.color||'#1A6B4A'}, ${g.color||'#1A6B4A'}99);`;
  }

  function renderGroups(groups) {
    const container = document.getElementById('groups-container');
    const discoverGroups = groups.filter(g => !myGroupIds.includes(g.id));
    if (discoverGroups.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">🕌</div><p>No groups found. Try a different filter or create your own!</p></div>';
      return;
    }
    container.innerHTML = '<div class="groups-grid" id="groups-grid"></div>';
    const grid = document.getElementById('groups-grid');
    discoverGroups.forEach((g, i) => {
      const isMember = myGroupIds.includes(g.id);
      const card = document.createElement('a');
      card.href = `group.html?id=${g.id}`;
      card.className = 'group-card';
      card.style.animationDelay = (i*0.05) + 's';
      card.style.animation = 'fadeUp 0.4s ease both';
      card.innerHTML = `
        <div class="group-banner" style="${getBannerStyle(g)}">
          ${g.emoji || '🕌'}
          <span class="group-privacy ${g.privacy}">${g.privacy === 'private' ? '🔒 Private' : '🔓 Public'}</span>
        </div>
        <div class="group-body">
          <div class="group-type-badge">${g.type === 'circle' ? '📖 Hifz Circle' : g.type === 'school' ? '🎓 School' : '🕌 Organization'}</div>
          <div class="group-name">${g.name}</div>
          <div class="group-desc">${g.desc}</div>
          <div class="group-footer">
            <div class="group-members">👥 ${(g.memberCount || (g.members||[]).length).toLocaleString()} members</div>
            <button class="join-btn ${isMember?'joined':''}" onclick="handleJoin(event,'${g.id}','${g.name.replace(/'/g,'')}',this)">
              ${isMember ? '✓ Joined' : g.privacy === 'private' ? '🔒 Request' : '+ Join'}
            </button>
          </div>
        </div>`;
      grid.appendChild(card);
    });
  }

  function renderMyGroups(groups) {
    const container = document.getElementById('my-groups-list');
    const mine = groups.filter(g => myGroupIds.includes(g.id));
    if (mine.length === 0) {
      container.innerHTML = '<div style="color:var(--muted);font-size:0.85rem;padding:0.5rem 0;">You haven\'t joined any groups yet. Discover and join below! 👇</div>';
      return;
    }
    container.innerHTML = '<div class="my-groups-list">' + mine.map(g => `
      <a href="group.html?id=${g.id}" class="my-group-item">
        <div class="my-group-icon" style="${getBannerStyle(g)}">${g.emoji||'🕌'}</div>
        <div class="my-group-info">
          <div class="my-group-name">${g.name}</div>
          <div class="my-group-meta">👥 ${(g.memberCount||(g.members||[]).length).toLocaleString()} members · ${g.type}</div>
        </div>
        <span class="my-group-role ${g.createdBy===currentUser?.uid?'admin':'member'}">${g.createdBy===currentUser?.uid?'Admin':'Member'}</span>
      </a>`).join('') + '</div>';
  }

  function filterAndSearch() {
    let filtered = allGroups;
    if (activeFilter !== 'all') {
      filtered = filtered.filter(g => g.type === activeFilter || g.privacy === activeFilter);
    }
    if (searchQuery) {
      const q = searchQuery.toLowerCase();
      filtered = filtered.filter(g => g.name.toLowerCase().includes(q) || (g.desc||'').toLowerCase().includes(q));
    }
    renderGroups(filtered);
    renderMyGroups(filtered.length > 0 ? allGroups : allGroups);
  }

  window.handleSearch = function() {
    searchQuery = document.getElementById('search-input').value.trim();
    filterAndSearch();
  }

  window.setFilter = function(filter, btn) {
    activeFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterAndSearch();
  }

  window.handleJoin = async function(e, groupId, groupName, btn) {
    e.preventDefault();
    if (!currentUser) return;
    const isJoined = myGroupIds.includes(groupId);
    if (isJoined) {
      // Leave group
      myGroupIds = myGroupIds.filter(id => id !== groupId);
      try { await updateDoc(doc(db,'users',currentUser.uid), { groups: arrayRemove(groupId) }); } catch(er) {}
      btn.textContent = '+ Join'; btn.classList.remove('joined');
      showToast('Left group.');
      renderMyGroups(allGroups);
    } else {
      // Join group
      myGroupIds.push(groupId);
      try { await updateDoc(doc(db,'users',currentUser.uid), { groups: arrayUnion(groupId) }); } catch(er) {}
      btn.textContent = '✓ Joined'; btn.classList.add('joined');
      showToast('✅ Joined ' + groupName + '! Alhamdulillah 🤲');
      renderMyGroups(allGroups);
    }
  }

  window.handleLogout = async function() { await signOut(auth); window.location.href = 'login.html'; }

  onAuthStateChanged(auth, async user => {
    if (user) {
      currentUser = user;
      try {
        const userDoc = await getDoc(doc(db,'users',user.uid));
        const userData = userDoc.exists() ? userDoc.data() : {};
        const name = userData.fullname || user.displayName || 'Friend';
        const _navEl=document.getElementById('nav-avatar');if(userData && userData.photoURL){_navEl.innerHTML=`<img src="${userData.photoURL}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`;}else{_navEl.textContent=name.split(' ').map(n=>n[0]).join('').toUpperCase().slice(0,2);}
        myGroupIds = userData.groups || [];

        // Load groups from Firebase
        const snap = await getDocs(collection(db,'groups'));
        allGroups = [];
        snap.forEach(d => allGroups.push({ id: d.id, ...d.data() }));

        // If no groups in DB yet, use defaults
        if (allGroups.length === 0) allGroups = defaultGroups;

      } catch(e) { console.error(e); allGroups = defaultGroups; }

      filterAndSearch();
      renderMyGroups(allGroups);
      document.getElementById('loading').style.display = 'none';
      document.getElementById('app').style.display = 'block';
    } else { window.location.href = 'login.html'; }
  });
</script>
</body>
