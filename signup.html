<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Join HuffazWorld – Create Your Account</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #C9A84C;
    --gold-light: #F0D98A;
    --emerald: #1A6B4A;
    --emerald-light: #E6F5EE;
    --emerald-dark: #0D3D29;
    --cream: #FAF7F0;
    --text: #1C2B22;
    --muted: #5A7060;
    --white: #ffffff;
    --error: #e53935;
    --success: #2e7d32;
  }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    background:
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(26,107,74,0.08) 0%, transparent 70%),
      var(--cream);
  }
  .card {
    background: var(--white);
    border-radius: 24px;
    border: 1px solid rgba(201,168,76,0.2);
    padding: 2.5rem 2rem;
    width: 100%;
    max-width: 460px;
    box-shadow: 0 20px 60px rgba(15,26,20,0.08);
    animation: fadeUp 0.6s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .logo {
    text-align: center;
    font-family: 'Amiri', serif;
    font-size: 2rem; font-weight: 700;
    color: var(--emerald-dark);
    margin-bottom: 0.25rem;
  }
  .logo span { color: var(--gold); }
  .logo-arabic {
    text-align: center;
    font-family: 'Amiri', serif;
    font-size: 0.95rem;
    color: var(--gold);
    margin-bottom: 1.5rem;
    direction: rtl;
  }
  h2 {
    font-size: 1.3rem; font-weight: 700;
    color: var(--emerald-dark);
    margin-bottom: 0.3rem;
  }
  .subtitle {
    font-size: 0.88rem; color: var(--muted);
    margin-bottom: 1.75rem; line-height: 1.6;
  }
  .divider {
    height: 1px; background: rgba(201,168,76,0.15);
    margin: 1.5rem 0;
  }
  .form-group { margin-bottom: 1rem; }
  label {
    display: block;
    font-size: 0.82rem; font-weight: 600;
    color: var(--emerald-dark);
    margin-bottom: 0.4rem;
  }
  input, select {
    width: 100%;
    padding: 0.75rem 1rem;
    border: 1.5px solid rgba(201,168,76,0.25);
    border-radius: 12px;
    font-size: 0.92rem;
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text);
    background: var(--cream);
    transition: border-color 0.2s, box-shadow 0.2s;
    outline: none;
  }
  input:focus, select:focus {
    border-color: var(--emerald);
    box-shadow: 0 0 0 3px rgba(26,107,74,0.1);
    background: white;
  }
  input::placeholder { color: #aab8af; }
  .role-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.6rem;
    margin-top: 0.4rem;
  }
  .role-option { display: none; }
  .role-label {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 0.75rem 0.5rem;
    border: 1.5px solid rgba(201,168,76,0.25);
    border-radius: 12px;
    cursor: pointer;
    font-size: 0.78rem; font-weight: 600;
    color: var(--muted);
    background: var(--cream);
    transition: all 0.2s;
    text-align: center; gap: 0.3rem;
  }
  .role-label .icon { font-size: 1.4rem; }
  .role-option:checked + .role-label {
    border-color: var(--emerald);
    background: var(--emerald-light);
    color: var(--emerald-dark);
    box-shadow: 0 0 0 3px rgba(26,107,74,0.1);
  }
  .btn {
    width: 100%;
    padding: 0.9rem;
    background: var(--emerald);
    color: white;
    border: none; border-radius: 12px;
    font-size: 1rem; font-weight: 700;
    font-family: 'Plus Jakarta Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 0.5rem;
  }
  .btn:hover { background: var(--emerald-dark); transform: translateY(-1px); }
  .btn:disabled { background: #aab8af; cursor: not-allowed; transform: none; }
  .message {
    padding: 0.75rem 1rem;
    border-radius: 10px;
    font-size: 0.85rem; font-weight: 500;
    margin-top: 1rem; display: none;
  }
  .message.error { background: #fdecea; color: var(--error); display: block; }
  .message.success { background: #e8f5e9; color: var(--success); display: block; }
  .login-link {
    text-align: center; margin-top: 1.25rem;
    font-size: 0.85rem; color: var(--muted);
  }
  .login-link a { color: var(--emerald); font-weight: 600; text-decoration: none; }
  .login-link a:hover { text-decoration: underline; }
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white; border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-right: 0.4rem; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <div class="logo">Huffaz<span>World</span></div>
  <div class="logo-arabic">مجتمع الحفّاظ العالمي</div>

  <h2>Create Your Account</h2>
  <p class="subtitle">Join thousands of Huffaz worldwide. It's free!</p>

  <div class="form-group">
    <label>Full Name</label>
    <input type="text" id="fullname" placeholder="e.g. Ahmad Hassan" />
  </div>

  <div class="form-group">
    <label>Email Address</label>
    <input type="email" id="email" placeholder="your@email.com" />
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Minimum 6 characters" />
  </div>

  <div class="form-group">
    <label>Country</label>
    <select id="country">
      <option value="">Select your country...</option>
      <option>Nigeria</option>
      <option>Saudi Arabia</option>
      <option>Egypt</option>
      <option>Pakistan</option>
      <option>Bangladesh</option>
      <option>Indonesia</option>
      <option>United Kingdom</option>
      <option>United States</option>
      <option>Malaysia</option>
      <option>Turkey</option>
      <option>Other</option>
    </select>
  </div>

  <div class="form-group">
    <label>I am a...</label>
    <div class="role-grid">
      <div>
        <input type="radio" name="role" id="role-hafiz" value="Hafiz" class="role-option" checked/>
        <label for="role-hafiz" class="role-label">
          <span class="icon">🏅</span> Hafiz
        </label>
      </div>
      <div>
        <input type="radio" name="role" id="role-student" value="Student" class="role-option"/>
        <label for="role-student" class="role-label">
          <span class="icon">📖</span> Student
        </label>
      </div>
      <div>
        <input type="radio" name="role" id="role-teacher" value="Teacher" class="role-option"/>
        <label for="role-teacher" class="role-label">
          <span class="icon">🎓</span> Teacher
        </label>
      </div>
    </div>
  </div>

  <button class="btn" id="signupBtn" onclick="handleSignup()">Create Free Account</button>

  <div class="message" id="message"></div>

  <div class="divider"></div>
  <div class="login-link">
    Already have an account? <a href="login.html">Sign In</a>
  </div>
</div>

<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDxKqk5lpSz7s4cRSQXLMCfQmfU8k-iHK8",
    authDomain: "huffazworld.firebaseapp.com",
    projectId: "huffazworld",
    storageBucket: "huffazworld.firebasestorage.app",
    messagingSenderId: "69769070061",
    appId: "1:69769070061:web:469c095c061654b4d013e4",
    measurementId: "G-FZWBCHPGRE"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.handleSignup = async function() {
    const fullname = document.getElementById('fullname').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const country = document.getElementById('country').value;
    const role = document.querySelector('input[name="role"]:checked').value;
    const btn = document.getElementById('signupBtn');
    const msg = document.getElementById('message');

    msg.className = 'message';
    msg.textContent = '';

    if (!fullname || !email || !password || !country) {
      msg.className = 'message error';
      msg.textContent = '⚠️ Please fill in all fields.';
      return;
    }
    if (password.length < 6) {
      msg.className = 'message error';
      msg.textContent = '⚠️ Password must be at least 6 characters.';
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating account...';

    try {
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      await updateProfile(user, { displayName: fullname });

      await setDoc(doc(db, "users", user.uid), {
        fullname,
        email,
        country,
        role,
        createdAt: new Date().toISOString(),
        uid: user.uid
      });

      msg.className = 'message success';
      msg.textContent = '✅ Account created! Redirecting to your dashboard...';

      setTimeout(() => { window.location.href = 'dashboard.html'; }, 1800);

    } catch (error) {
      btn.disabled = false;
      btn.innerHTML = 'Create Free Account';
      let errorMsg = '⚠️ Something went wrong. Please try again.';
      if (error.code === 'auth/email-already-in-use') errorMsg = '⚠️ This email is already registered. Try logging in.';
      if (error.code === 'auth/invalid-email') errorMsg = '⚠️ Please enter a valid email address.';
      if (error.code === 'auth/weak-password') errorMsg = '⚠️ Password is too weak. Use at least 6 characters.';
      msg.className = 'message error';
      msg.textContent = errorMsg;
    }
  }
</script>
</body>
</html>
